:root{--bg:#FFF8DC;--cd:#fff;--tx:#1F1A05;--mu:#6B5F2A;--bd:#F0E2A8;--bd2:#E3D18A;--ac:#2F7D12;--y:#F5C400;--yd:#5C4A00;--pb:#F0E2A8;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#1A1606;--cd:#262010;--tx:#FFF3C4;--mu:#D8C680;--bd:#3A3115;--bd2:#4F4421;--ac:#8FD46A;--yd:#F5D95A;--pb:#3A3115}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.app{max-width:430px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media(min-width:600px){body{background:#EBD98A}.app{height:min(900px,96vh);margin:2vh auto;border-radius:26px;box-shadow:0 10px 40px rgba(90,70,0,.3)}}
.top{border-bottom:4px solid var(--ac);background:var(--y);color:#1F1A05;padding:calc(22px + env(safe-area-inset-top,0px)) 20px 18px;border-radius:0 0 22px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex:none}
.top small{color:#5C4A00;font-size:12px}.top h1{margin:2px 0 0;font-size:20px}.top .r{display:flex;align-items:center;gap:8px}
.lg{width:44px;height:44px;border-radius:50%;background:#fff;padding:3px;object-fit:contain;flex:none}
.ib{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.65);color:#1F1A05;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ib i{position:absolute;top:2px;right:2px;min-width:17px;height:17px;border-radius:9px;background:#B42318;color:#fff;font:700 10px/17px inherit;font-style:normal;text-align:center;padding:0 4px}
.ct{flex:1;overflow-y:auto;padding:16px 18px 20px;display:flex;flex-direction:column;gap:12px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px}
h2{margin:0 0 8px;font-size:15px;color:var(--yd)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sm{font-size:12px;color:var(--mu)}.pb{height:8px;background:var(--pb);border-radius:9px;overflow:hidden;margin-top:9px}.pb i{display:block;height:100%;background:var(--ac);border-radius:9px}.pb i.a{background:#B45309}
.bg{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap;margin:2px 4px 2px 0}
.ok{background:#D1FAE5;color:#065F46}.wt{background:#FEF3C7;color:#92400E}.no{background:#FEE4E2;color:#B42318}.gr{background:#E7E5E4;color:#44403C}
.btn{border:0;border-radius:12px;min-height:46px;width:100%;font:700 14px inherit;background:var(--y);color:#1F1A05;cursor:pointer;box-shadow:0 3px 0 #2F7D12}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #2F7D12}.btn.o{background:var(--cd);color:var(--yd);border:1px solid var(--bd2);box-shadow:none}.btn.r{background:var(--cd);color:#B42318;border:1px solid #F1B5AE;box-shadow:none}.btn.s{min-height:38px;font-size:12px;width:auto;padding:0 14px}
.btn:disabled{opacity:.5}
.ck{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd)}.ck:last-child{border:0;padding-bottom:0}.ck:first-child{padding-top:0}
.ck b{display:block;font-size:13px}.ck span{font-size:12px;color:var(--mu)}.ck .g{flex:1;min-width:0}
.tap{cursor:pointer}
.dot{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.dot.y{background:#D1FAE5;color:#065F46}.dot.n{background:#FEE4E2;color:#B42318}.dot.w{background:#FEF3C7;color:#92400E}
.seg{display:flex;background:var(--pb);border-radius:12px;padding:4px;gap:2px}.seg button{flex:1;min-height:38px;border:0;border-radius:9px;background:transparent;font:600 13px inherit;color:var(--mu);cursor:pointer}.seg button.on{background:var(--cd);color:var(--yd);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.nav{display:flex;background:var(--cd);border-top:1px solid var(--bd);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));flex:none}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 10.5px inherit;color:var(--mu);cursor:pointer;padding:4px 0;position:relative}.nav button.on{color:var(--ac)}
.nav button i{position:absolute;top:0;left:55%;min-width:16px;height:16px;border-radius:8px;background:#B42318;color:#fff;font:700 9px/16px inherit;font-style:normal;padding:0 4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 14px;border-radius:99px;background:var(--cd);border:1px solid var(--bd2);font:600 12px inherit;color:var(--yd);cursor:pointer}.chip.on{background:var(--y);color:#1F1A05;border-color:#E0AE00}
.lb{font-size:12px;font-weight:600;margin:8px 0 5px;display:block}.lb:first-child{margin-top:0}
.in{width:100%;min-height:44px;border:1px solid var(--bd2);border-radius:10px;padding:0 12px;font:500 14px inherit;background:var(--cd);color:var(--tx)}textarea.in{padding:10px 12px;min-height:80px;resize:vertical}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g4 .cd strong{display:block;font-size:26px;color:var(--yd);margin-top:2px}
.act{display:flex;gap:10px;margin-top:10px}.act .btn{min-height:42px;font-size:13px}.lock{font-size:11px;color:var(--mu)}
.ring{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}.ring div{width:58px;height:58px;border-radius:50%;background:var(--cd);display:flex;flex-direction:column;align-items:center;justify-content:center}
.lgd{display:flex;align-items:center;gap:6px;font-size:12px}.lgd i{width:10px;height:10px;border-radius:3px;display:inline-block}
.drop{border:2px dashed var(--bd2);border-radius:12px;padding:16px;text-align:center;color:var(--mu);cursor:pointer;font-size:13px}
.sheet{position:absolute;inset:0;background:rgba(20,15,0,.5);display:flex;align-items:flex-end;z-index:20}.sheet>div{background:var(--bg);width:100%;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#1F1A05;color:#FFF3C4;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;z-index:30;max-width:90%;text-align:center;animation:tt .25s}
@keyframes tt{from{opacity:0;transform:translate(-50%,10px)}}
.center{margin:auto 0;display:flex;flex-direction:column;gap:12px}
iframe.pv{width:100%;height:260px;border:1px solid var(--bd2);border-radius:10px;background:#fff}
/* splash */
.sp{position:absolute;inset:0;background:#FFFBEA;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s,filter .6s,transform .6s}.sp.out{opacity:0;filter:blur(10px);transform:scale(1.08);pointer-events:none}
.sp .bl{position:absolute;border-radius:50%;filter:blur(64px);opacity:.34;animation:dr 7s ease-in-out infinite alternate}.b1{width:300px;height:300px;background:#5DBB1F;top:-80px;left:-110px}.b2{width:340px;height:340px;background:#F5C400;bottom:60px;right:-120px}
.ds{position:relative;width:190px;height:190px;display:flex;align-items:center;justify-content:center;animation:ds 1.1s cubic-bezier(.2,1.25,.4,1) both}.dk{position:absolute;inset:12px;border-radius:50%;background:#fff;box-shadow:0 24px 56px rgba(120,92,0,.22);display:flex;align-items:center;justify-content:center;overflow:hidden}.dk img{width:130px;mix-blend-mode:multiply}
.rg{position:absolute;inset:0;transform:rotate(-90deg)}.rg circle{fill:none;stroke-width:4;stroke-linecap:round}.rg .p{stroke:#2F7D12;stroke-dasharray:603;stroke-dashoffset:603;animation:rg 2.2s .3s cubic-bezier(.5,0,.2,1) forwards}.rg .t{stroke:#F0E2A8}
.sp b{margin-top:28px;font-size:21px;color:#5C4A00;animation:fi .8s .5s both}.sp em{font-style:normal;font-weight:700;color:#2F7D12;letter-spacing:5px;font-size:14px;animation:fi .8s .7s both}.sp small{color:#6B5F2A;letter-spacing:2.5px;font-size:11px;margin-top:12px;animation:fi .8s .9s both}
@keyframes dr{to{transform:translate(40px,30px) scale(1.12)}}@keyframes ds{from{opacity:0;transform:scale(.4)}}@keyframes rg{to{stroke-dashoffset:0}}@keyframes fi{from{opacity:0;transform:translateY(12px)}}

pindah(){const t=$('#tj').value.trim();if(!t)return toast('Isi instansi tujuan');S.pindah.push({nidn:me.id,alasan:$('#al').value,tujuan:t,tgl:$('#tg').value,d:new Date().toISOString()});addLog('mengajukan pindah tugas');save();toast('Permintaan dikirim ke admin');render()},
adddosen:dosenForm,
savedosen(){const n=$('#a1').value.trim(),nm=$('#a2').value.trim();if(!/^\d{6,20}$/.test(n))return toast('NIDN/NUPTK harus berupa angka (min. 6 digit)');if(!nm)return toast('Isi nama lengkap');if(dsn(n))return toast('NIDN/NUPTK sudah terdaftar');
 S.dosen.push({nidn:n,nama:nm,prodi:$('#a3').value,jab:$('#a4').value,email:$('#a5').value.trim(),hp:$('#a6').value.trim(),pass:n,ganti:0});addLog(`mendaftarkan dosen ${nm}`);save();closeSheet();toast('Dosen terdaftar');render()},
doreset(e){const d=dsn(e.dataset.id);if(!d)return;d.pass=d.nidn;d.ganti=0;S.reset.forEach(x=>{if(x.nidn===d.nidn)x.done=1});addLog(`mereset kata sandi ${d.nama}`);save();toast('Kata sandi dikembalikan ke NIDN');render()},
out(e){kick(e.dataset.id)},
kickok(e){const n=e.dataset.id,d=dsn(n);S.files.filter(f=>f.nidn===n).forEach(f=>bdel(f.id));S.files=S.files.filter(f=>f.nidn!==n);S.notif=S.notif.filter(x=>x.nidn!==n);S.dosen=S.dosen.filter(x=>x.nidn!==n);S.pindah.forEach(x=>{if(x.nidn===n)x.done=1});addLog(`mengeluarkan ${d.nama} dari database`);save();closeSheet();toast('Dosen dikeluarkan');go('dosen')},
savedl(){const v=$('#dl').value;if(!v)return toast('Pilih tanggal');S.dl[tab]=v;addLog(`mengatur batas unggah ${TR[tab]} ${dfmt(v)}`);S.dosen.forEach(d=>notify(d.nidn,'wt','Batas unggah diperbarui',`${TR[tab]}: ${dfmt(v)}`));save();toast('Batas waktu disimpan');render()},
togreq(e){const r=S.reqs.find(r=>r.id===e.dataset.id);r.on=r.on?0:1;addLog(`${r.on?'mengaktifkan':'menonaktifkan'} syarat ${r.nama}`);save();render()},
delreq(e){const r=S.reqs.find(r=>r.id===e.dataset.id);if(!confirm('Hapus persyaratan "'+r.nama+'"?'))return;S.reqs=S.reqs.filter(x=>x!==r);addLog(`menghapus syarat ${r.nama}`);save();render()},
addreq(){sheet(`<h2>Tambah Persyaratan (${tab==='serdos'?'Serdos':'JAD'})</h2><label class="lb" for="rn">Nama persyaratan</label><input class="in" id="rn"><label class="lb" for="rk">Keterangan / berkas</label><input class="in" id="rk" placeholder="Berkas: …"><button class="btn" data-act="saveeq">Simpan</button>`)},
saveeq(){const n=$('#rn').value.trim();if(!n)return toast('Isi nama persyaratan');S.reqs.push({id:uid('r'),track:tab,nama:n,ket:$('#rk').value.trim()||'Berkas',on:1});S.dosen.forEach(d=>notify(d.nidn,'wt','Persyaratan diperbarui',`Admin menambah syarat: ${n}`));addLog(`menambah syarat ${n}`);save();closeSheet();render()},
review(e){reviewSheet(e.dataset.id)},viewf(e){reviewSheet(e.dataset.id)},approve(e){decide(e.dataset.id,1)},reject(e){decide(e.dataset.id,0)},
pdf(){$('#pr').innerHTML=printHtml();setTimeout(()=>window.print(),100);addLog('mencetak laporan');save()},
csv(){const t=[HD,...rows()].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');const b=new Blob(['\ufeff'+t],{type:'text/csv'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='laporan-sipkd.csv';a.click();
  sheet(`<h2>Data laporan</h2><p class="sm">Jika unduhan tidak dimulai, salin data berikut ke Excel (tempel sebagai teks).</p><textarea class="in" style="min-height:160px" readonly onfocus="this.select()">${esc([HD,...rows()].map(r=>r.join('\t')).join('\n'))}</textarea><button class="btn o" data-act="close">Tutup</button>`);addLog('mengekspor laporan')},
resetadm(e){const p=prompt('Kata sandi baru (min. 6 karakter):');if(!p||p.length<6)return;S.users.find(u=>u.id===e.dataset.id).pass=p;addLog('mengganti kata sandi '+e.dataset.id);save();toast('Kata sandi diganti')},
wipe(){if(!confirm('Hapus SEMUA data dosen, berkas, dan notifikasi? Tidak dapat dibatalkan.'))return;S.files.forEach(f=>bdel(f.id));S.dosen=[];S.files=[];S.notif=[];S.reset=[];S.pindah=[];addLog('mengosongkan data dosen');save();toast('Data dikosongkan');render()},
demo(){if(!confirm('Kembalikan ke data contoh? Data saat ini akan hilang.'))return;S.files.forEach(f=>bdel(f.id));const u=me;seed();me=u;toast('Data contoh dipulihkan');render()}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act],[data-go]');if(!t)return;if(t.dataset.go){closeSheet();return go(t.dataset.go,{id:t.dataset.id})}const f=A[t.dataset.act];if(f)f(t)});
document.addEventListener('input',e=>{if(e.target.id==='s'){q=e.target.value;$('#lst').innerHTML=dList(S.dosen.filter(d=>(d.nama+d.nidn).toLowerCase().includes(q.toLowerCase())))}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!me&&e.target.tagName==='INPUT')lmode==='lupa'?A.lupa():doLogin()});
/* splash */
if(me&&!(me.role==='dosen'?dsn(me.id):S.users.find(u=>u.id===me.id)))me=null;
render();
const sp=document.createElement('div');sp.className='sp';sp.innerHTML=`<div class="bl b1"></div><div class="bl b2"></div><div class="ds"><div class="dk"><img src="${LOGO}" alt="Logo UNIKA De La Salle Manado"></div><svg class="rg" viewBox="0 0 200 200" aria-hidden="true"><circle class="t" cx="100" cy="100" r="96"/><circle class="p" cx="100" cy="100" r="96"/></svg></div><b>UNIKA DE LA SALLE</b><em>MANADO</em><small>RELIGIO · MORES · CULTURA</small>`;$('#app').append(sp);
setTimeout(()=>sp.classList.add('out'),2300);setTimeout(()=>sp.remove(),3000);
</script>
