<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SIPKD — Sistem Informasi Pengembangan Karier Dosen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HALAMAN LOGIN -->
  <div id="lg">
    <!-- Panel Kiri: Identitas Universitas -->
    <div class="lg-l">
      <div class="lg-logo">
        <img src="Univ_Katolik_De_La_Salle.jpeg" alt="Logo Unika De La Salle Manado">
      </div>
      <h2>UNIKA DE LA SALLE MANADO</h2>
      <div class="lg-mt">RELIGIO · MORES · CULTURA</div>
      <p>Menyiapkan Pengembangan Karier Dosen</p>
    </div>

    <!-- Panel Kanan: Form Masuk (Hanya NIDN/NUPTK & Kata Sandi) -->
    <div class="lg-r">
      <div class="lg-box">
        <h1>SIPKD</h1>
        <p class="lg-sub">Sistem Informasi Pengembangan Karier Dosen</p>

        <form id="f-login" onsubmit="lgin(event)">
          <div class="fg">
            <label for="in-nidn">NIDN / NUPTK</label>
            <input type="text" id="in-nidn" placeholder="Masukkan NIDN / NUPTK Anda" required autocomplete="off">
          </div>

          <div class="fg">
            <label for="in-pass">Kata sandi</label>
            <input type="password" id="in-pass" placeholder="Masukkan kata sandi" required>
          </div>

          <button type="submit" class="btn-lg">Masuk</button>
        </form>

        <p class="lg-note">
          Akses terbatas untuk civitas Unika De La Salle Manado. Akun dosen didaftarkan oleh admin BAAD.
        </p>
      </div>
    </div>
  </div>

  <!-- KONTAINER UTAMA APLIKASI (BERANDA DOSEN / ADMIN / WR 1) -->
  <div id="app" class="hide">
    <aside class="sb" id="sb"></aside>
    <div class="mn">
      <header class="tb" id="tb"></header>
      <main class="ct" id="ct"></main>
    </div>
  </div>

  <!-- MODAL & TOAST NOTIFIKASI -->
  <div id="md" class="md hide"></div>
  <div id="ts" class="ts"></div>

  <!-- SCRIPT APLIKASI -->
  <script src="data.js"></script>
  <script src="core.js"></script>
  <script src="dosen.js"></script>
  <script src="admin.js"></script>
  <script src="wr.js"></script>
</body>
</html>
